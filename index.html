<style>
/* الشاشة الافتتاحية (مثل بداية فيديو المقرأة) */
#splash { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#splash .sp-bg { position: absolute; inset: 0; background: radial-gradient(120vmax 90vmax at 50% 35%, #0f6b51 0%, #0a4a39 45%, #052c22 100%); transition: opacity .4s ease; }
#splash .sp-pat { position: absolute; left: 50%; top: 42%; width: 240vmax; height: 240vmax; margin: -120vmax 0 0 -120vmax; opacity: .1; animation: spSpin 60s linear infinite; }
#splash .sp-glow { position: absolute; left: 50%; top: 40%; width: 130vmin; height: 130vmin; margin: -65vmin 0 0 -65vmin; border-radius: 50%; background: radial-gradient(circle, rgba(217,180,90,.22), rgba(217,180,90,0) 65%); }
#splash .sp-in { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 16px; }
#splash .sp-logo { width: min(34vmin, 170px); height: min(34vmin, 170px); animation: spLogo .7s cubic-bezier(.34,1.56,.64,1) .02s both; }
#splash .sp-name { font: 700 clamp(56px, 15vmin, 112px)/1.2 'Aref Ruqaa', 'Amiri', serif; color: #d9b45a; text-shadow: 0 8px 36px rgba(0,0,0,.4); margin-top: 6px; animation: spUp .45s cubic-bezier(.2,.7,.2,1) .3s both; }
#splash .sp-orn { width: min(62vmin, 300px); height: auto; margin: 4px 0 10px; animation: spUp .4s ease-out .5s both; }
#splash .sp-tag { font: 400 clamp(20px, 5.4vmin, 32px)/1.6 'Amiri', serif; color: #f3e7c6; animation: spUp .45s ease-out .6s both; }
#splash.out { pointer-events: none; }
#splash.out .sp-bg { opacity: 0; }
#splash.out .sp-name, #splash.out .sp-orn, #splash.out .sp-tag { animation: spOut .22s ease forwards; }
@keyframes spOut { to { opacity: 0; transform: scale(.97); } }
@keyframes spLogo { 0% { transform: scale(.2) rotate(-180deg); opacity: 0; } 35% { opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes spUp { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes spSpin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #splash * { animation-duration: .01s !important; animation-delay: 0s !important; } }
html.splashing body { overflow: hidden; }
</style>

<div id="splash" aria-hidden="true">
  <div class="sp-bg"><svg class="sp-pat" viewBox="0 0 200 200"><defs><pattern id="spP" width="40" height="40" patternUnits="userSpaceOnUse"><g fill="none" stroke="#d9b45a" stroke-width="1"><rect x="10" y="10" width="20" height="20"/><rect x="10" y="10" width="20" height="20" transform="rotate(45 20 20)"/><circle cx="20" cy="20" r="4"/></g></pattern></defs><rect width="200" height="200" fill="url(#spP)"/></svg><div class="sp-glow"></div></div>
  <div class="sp-in"><svg class="sp-logo" viewBox="0 0 32 32" aria-hidden="true"><g fill="#d9b45a"><rect x="7" y="7" width="18" height="18" rx="2"/><rect x="7" y="7" width="18" height="18" rx="2" transform="rotate(45 16 16)"/></g><circle cx="16" cy="16" r="5" fill="#0d5c46"/><circle cx="16" cy="16" r="3" fill="#f3e7c6"/></svg><div class="sp-name">مقرأة الفاتح</div><svg class="sp-orn" viewBox="0 0 540 40" aria-hidden="true"><g fill="#d9b45a"><g transform="translate(30 20)"><rect x="-6" y="-6" width="12" height="12"/><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)"/></g><g transform="translate(90 20)"><rect x="-6" y="-6" width="12" height="12"/><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)"/></g><g transform="translate(150 20)"><rect x="-6" y="-6" width="12" height="12"/><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)"/></g><g transform="translate(210 20)"><rect x="-6" y="-6" width="12" height="12"/><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)"/></g><g transform="translate(270 20)"><rect x="-12" y="-12" width="24" height="24"/><rect x="-12" y="-12" width="24" height="24" transform="rotate(45)"/></g><g transform="translate(330 20)"><rect x="-6" y="-6" width="12" height="12"/><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)"/></g><g transform="translate(390 20)"><rect x="-6" y="-6" width="12" height="12"/><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)"/></g><g transform="translate(450 20)"><rect x="-6" y="-6" width="12" height="12"/><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)"/></g><g transform="translate(510 20)"><rect x="-6" y="-6" width="12" height="12"/><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)"/></g></g><path d="M20 20H250M290 20H520" stroke="#d9b45a" stroke-width="1.5" opacity=".6"/></svg><div class="sp-tag">اقرأ… ونحن نتابعك كلمةً بكلمة</div></div>
</div>
<script>
// تظهر مرة عند كل فتح للموقع (لا عند التنقل بين صفحاته)، ثانيتان كحد أقصى، ويمكن تخطيها بلمسة
(function () {
  var root = document.documentElement, el = document.getElementById('splash');
  root.classList.add('splashing');
  var t0 = Date.now(), MIN = matchMedia('(prefers-reduced-motion: reduce)').matches ? 400 : 1300, done = false;
  function finish() {
    if (done) return; done = true;
    var logo = el.querySelector('.sp-logo'), tgt = document.querySelector('.hero-logo');
    el.classList.add('out');
    var end = function () { root.classList.remove('splashing'); root.classList.add('splash-gone'); el.remove(); setTimeout(function () { root.classList.remove('hero-arrive'); }, 1000); };
    var b = tgt && tgt.getBoundingClientRect();
    if (b && b.width && b.top > -b.height && b.top < innerHeight) {
      // الشعار ينتقل إلى مكانه أعلى الصفحة الرئيسية
      var a = logo.getBoundingClientRect();
      var dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
      logo.style.animation = 'none';
      logo.style.transition = 'transform .5s cubic-bezier(.65,0,.35,1)';
      requestAnimationFrame(function () { logo.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + (b.width / a.width) + ')'; });
      root.classList.add('hero-arrive');
      setTimeout(end, 520);
    } else {
      logo.style.transition = 'opacity .4s'; logo.style.opacity = '0';
      setTimeout(end, 450);
    }
  }
  window.__splashReady = function () { setTimeout(finish, Math.max(0, MIN - (Date.now() - t0))); };
  el.addEventListener('click', finish);
  setTimeout(finish, 2000); // لا تتجاوز ثانيتين حتى لو تأخر تحميل الموقع
})();
</script>
