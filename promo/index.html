<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مقرأة الفاتح · طريقة الاستخدام</title>
<meta name="description" content="فيديو قصير يشرح للطالب طريقة استخدام مقرأة الفاتح: الدخول بالرمز، التسميع، الدرجات، وتثبيت المقرأة على الجوال.">
<meta name="theme-color" content="#0b3d2e">
<meta property="og:title" content="مقرأة الفاتح · طريقة الاستخدام">
<meta property="og:image" content="poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
  :root { --bg: #0b3d2e; --bg2: #0d5c46; --gold: #d9b45a; --ink: #fffdf7; --muted: #cfe0d8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg)); color: var(--ink); font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px 28px; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  header { display: flex; align-items: center; gap: 10px; justify-content: center; }
  header svg { width: 34px; height: 34px; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; }
  p { margin: 0; color: var(--muted); text-align: center; font-size: 15px; line-height: 1.7; }
  .vid { position: relative; max-height: 78vh; aspect-ratio: 9 / 16; margin: 0 auto; border-radius: 18px; overflow: hidden; border: 1.5px solid color-mix(in srgb, var(--gold) 60%, transparent); box-shadow: 0 18px 50px rgba(0,0,0,.35); background: #000; }
  .vid video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
  .row { display: flex; gap: 10px; }
  .btn { flex: 1; display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 13px 16px; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1.2; text-decoration: none; border: 1.5px solid var(--gold); color: var(--ink); background: transparent; cursor: pointer; }
  .btn.primary { background: var(--gold); color: #1d2a24; border-color: var(--gold); }
  .vid { width: min(100%, calc(78vh * 9 / 16)); }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="#d9b45a"><rect x="7" y="7" width="18" height="18" rx="2"/><rect x="7" y="7" width="18" height="18" rx="2" transform="rotate(45 16 16)"/></g><circle cx="16" cy="16" r="4" fill="#0b3d2e"/></svg>
    <h1>مقرأة الفاتح</h1>
  </header>
  <p>شاهد كيف تدخل وتسمّع وتثبّت المقرأة على جوالك 🎬</p>
  <div class="vid"><video src="maqraa-alfateh.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video></div>
  <div class="row">
    <a class="btn primary" href="../#/student">ادخل المقرأة</a>
    <button class="btn" type="button" id="share">مشاركة</button>
  </div>
</main>
<script>
  const b = document.getElementById('share');
  b.onclick = async () => {
    const data = { title: 'مقرأة الفاتح', text: 'طريقة استخدام مقرأة الفاتح', url: location.href };
    try {
      if (navigator.share) await navigator.share(data);
      else { await navigator.clipboard.writeText(location.href); b.textContent = 'نُسخ الرابط ✓'; }
    } catch {}
  };
</script>
</body>
</html>
